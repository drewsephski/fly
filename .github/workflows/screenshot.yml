name: Screenshot Landing Page

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL of the local instance to screenshot
        required: false
        default: http://localhost:3000
      port:
        description: Port the local instance runs on
        required: false
        default: '3000'

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate dependencies exist
        run: |
          if [ ! -f package.json ]; then
            echo "::error::package.json not found"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve target URL
        id: target-url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.url }}" ] && [ "${{ github.event.inputs.url }}" != "http://localhost:3000" ]; then
            echo "TARGET_URL=${{ github.event.inputs.url }}" >> $GITHUB_ENV
          else
            HOMEPAGE=$(gh repo view --json homepageUrl -q .homepageUrl)
            if [ -n "$HOMEPAGE" ] && [ "$HOMEPAGE" != "null" ]; then
              echo "TARGET_URL=$HOMEPAGE" >> $GITHUB_ENV
            else
              echo "TARGET_URL=${{ github.event.inputs.url }}" >> $GITHUB_ENV
            fi
          fi

      - name: Install agent-browser
        run: |
          npm install -g agent-browser
          agent-browser install

      - name: Install project dependencies
        if: hashFiles('package.json') != ''
        run: npm install

      - name: Start local dev server
        if: hashFiles('package.json') != ''
        run: |
          npm run dev &
          npx -y wait-on@latest ${{ env.TARGET_URL }} --timeout 30000

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_URL: ${{ env.TARGET_URL }}
        with:
          model: opencode/big-pickle
          prompt: |
            Navigate to ${{ env.TARGET_URL }} using agent-browser:
              1. Run `agent-browser open ${{ env.TARGET_URL }}` and wait for the page to load completely
              2. Wait for page to settle: `agent-browser wait 5000`
              3. Run `agent-browser snapshot -i --json` to inspect interactive elements
              4. Wait for layout to stabilize: `agent-browser wait 3000`
              5. Take a full-page screenshot: `agent-browser screenshot --full landing-page.png`

            Then analyze the page using UI/UX best practices and the design-consultation skill:
              - Evaluate layout, typography, color hierarchy, spacing, consistency, accessibility, and responsiveness
              - Assign a rating from 1 (worst) to 10 (best)
              - List specific strengths and weaknesses with actionable recommendations

            Finally, create a GitHub Issue using `gh issue create` (GITHUB_TOKEN is available in env) with the title "UI/UX Audit: ${{ env.TARGET_URL }}" and the full analysis as the body. Include the rating as a label (e.g. "rating-6") and attach the screenshot path.

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: landing-page
          path: landing-page.png
